[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "osc-lib"
description = "OpenStackClient Library"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
dynamic = ["version"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: OpenStack",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "cliff>=4.9.0", # Apache-2.0
    "keystoneauth1>=5.10.0", # Apache-2.0
    "openstacksdk>=4.12.0", # Apache-2.0
    "oslo.i18n>=3.15.3", # Apache-2.0
    "oslo.utils>=3.33.0", # Apache-2.0
    "pbr!=2.1.0,>=2.0.0", # Apache-2.0
    "requests>=2.14.2", # Apache-2.0
    "stevedore>=1.20.0", # Apache-2.0
]

[dependency-groups]
# NOTE(stephenfin): The duplication between this and the extra is intentional.
# The extra is for external consumers of our test utils. This is for us.
test = [
    "coverage!=4.4,>=4.0", # Apache-2.0
    "fixtures>=3.0.0", # Apache-2.0/BSD
    "requests-mock>=1.1.0", # Apache-2.0
    "stestr>=1.0.0", # Apache-2.0
    "testtools>=2.2.0", # MIT
    "osprofiler>=1.4.0", # Apache-2.0
]
doc = [
    "openstackdocstheme>=2.2.1", # Apache-2.0
    "reno>=3.1.0", # Apache-2.0
    "sphinx>=2.0.0,!=2.1.0", # BSD
    "sphinxcontrib-apidoc>=0.2.0", # BSD
]
types = [
    "mypy",
    "types-requests",
]

[project.urls]
Homepage = "https://docs.openstack.org/osc-lib/"
Repository = "https://opendev.org/openstack/osc-lib/"
"Bug Tracker" = "https://storyboard.openstack.org/#!/project/openstack/osc-lib"

[project.optional-dependencies]
test = [
    "fixtures>=3.0.0", # Apache-2.0/BSD
    "testtools>=2.2.0",  # MIT
]

[tool.setuptools.packages.find]
include = ["osc_lib*"]

[tool.mypy]
python_version = "3.11"
show_column_numbers = true
show_error_context = true
strict = true
disable_error_code = ["import-untyped"]
exclude = "(?x)(doc | releasenotes)"

[[tool.mypy.overrides]]
module = ["osc_lib.tests.*"]
ignore_errors = true

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "preserve"
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "S", "UP"]
external = ["H"]
ignore = [
    # we only use asserts for type narrowing
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"osc_lib/tests/*" = ["S"]
